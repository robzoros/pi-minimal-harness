project: pi-minimal-harness

defaults:
  workflow_mode: full
  auto_harness: true
  allow_dispatch: true
  subagent_context_file: pi-minimal-harness.md
  # A question, an idea or anything needing conceptual design routes to the
  # `analysis` workflow (orchestrator -> architect) instead of ending after the
  # orchestrator. Set to false to make ANSWER_ONLY end the pipeline there.
  analysis_routing: true
  # Where the architect keeps the formal requirements of the work in design.
  requirements_file: REQUIREMENTS.md
  strict_decision_marker: true
  preflight_policy: advisory

commands:
  preferred_interface: slash
  fallback_interface: skills
  model_catalog_source: /models

workflows:
  full-dry-run:
    steps:
      - orchestrator
      - explorer
      - critic

  full:
    steps:
      - orchestrator
      - explorer
      - critic
      - implementer
      - delivery

  analysis:
    steps:
      - orchestrator
      - architect

agents:
  architect:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - engram
      - codegraph
    prompt_template: prompts/architecture.md
    responsibilities:
      - discuss_with_the_user
      - analyse_the_repository
      - maintain_the_requirements_file
      - record_findings_with_engram
  orchestrator:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: false
    tools:
      - filesystem
      - engram
      - codegraph
      # The orchestrator identifies (or creates) the issue the delivery step
      # must close, so it needs the GitHub tool as well.
      - github
    prompt_template: prompts/orchestrator.md
    responsibilities:
      - classify_task
      - select_workflow_mode
      - prepare_next_agent_prompt
      - record_findings_with_engram

  explorer:
    model: opencode-go/deepseek-v4.1-flash
    reasoning: low
    mutates_files: false
    tools:
      - filesystem
      - openspec
      - engram
      - codegraph
    prompt_template: prompts/explorer.md
    responsibilities:
      - explore_repository
      - identify_relevant_files
      - propose_solution
      - record_findings_with_engram

  critic:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: false
    tools:
      - filesystem
      - openspec
    prompt_template: prompts/critic.md
    responsibilities:
      - challenge_plan
      - identify_risks
      - suggest_simpler_approach

  implementer:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - shell
      - tests
      - engram
      - codegraph
    prompt_template: prompts/implementer.md
    responsibilities:
      - check_dependents_before_editing_shared_symbols
      - edit_files
      - run_checks
      - inspect_diff
      - record_findings_with_engram

  delivery:
    model: opencode-go/longcat-2.5-preview-free
    reasoning: low
    mutates_files: true
    tools:
      - git
      - github
    skills:
      - github-delivery
    prompt_template: prompts/delivery.md
    responsibilities:
      - create_branch
      - commit_changes
      - push_branch
      - create_pull_request

skills:
  project_directory: .agents/skills
  current:
    - github-delivery
  create_when:
    - a procedure is repeated across tasks
    - a procedure has safety or ordering constraints
    - a procedure requires project-specific conventions
    - a procedure benefits from a checklist
