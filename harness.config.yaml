project: pi-minimal-harness

defaults:
  workflow_mode: full
  auto_harness: true
  allow_dispatch: true
  subagent_context_file: pi-minimal-harness.md
  # A question, an idea or anything needing conceptual design routes to the
  # `analysis` workflow (orchestrator -> architect) instead of ending after the
  # orchestrator. Set to false to make ANSWER_ONLY end the pipeline there.
  analysis_routing: true
  # Where the architect keeps the formal requirements of the work in design.
  requirements_file: REQUIREMENTS.md
  # The shape init/update write when they create that file: `sections` is the
  # three empty headings, `req-n` is one `### REQ-nnn` block per requirement.
  # The harness never parses it — it is a convention the project picks, not a
  # setting with consequences. Change it with /harness-config.
  requirements_format: req-n
  strict_decision_marker: true
  preflight_policy: advisory
  # How long a check declared in a step report may run before the harness gives
  # up on it (REQ-002). Separate from the preflight's short git probes: a test
  # suite legitimately takes seconds.
  check_timeout_ms: 300000

commands:
  preferred_interface: slash
  fallback_interface: skills
  model_catalog_source: /models

workflows:
  full-dry-run:
    steps:
      - orchestrator
      - explorer
      - critic

  full:
    steps:
      - orchestrator
      - explorer
      - critic
      - implementer
      - tester
      - delivery

  analysis:
    steps:
      - orchestrator
      - architect

agents:
  architect:
    model: opencode-go/deepseek-v4.1-flash
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - engram
      - codegraph
      # Issues belong to the architect (REQ-011): an issue is a statement of
      # scope, and creating one is writing the contract — which is exactly what
      # REQ-007 took away from everyone else. The architect creates the issue the
      # work closes when you approve the requirements.
      - github
    prompt_template: prompts/architecture.md
    responsibilities:
      - discuss_with_the_user
      - analyse_the_repository
      - maintain_the_requirements_file
      - record_findings_with_engram
  orchestrator:
    model: opencode-go/longcat-2.5-preview-free
    reasoning: minimal
    mutates_files: false
    # The router is granted no tools at all (REQ-011). Its two control tools,
    # harness_decision and harness_report, are registered by the extension itself
    # and are not gated by this list, so routing survives an empty one. An issue
    # is a statement of scope, and scope belongs to the architect.
    tools: []
    prompt_template: prompts/orchestrator.md
    responsibilities:
      - classify_task
      - select_workflow_mode
      - prepare_next_agent_prompt

  explorer:
    model: opencode-go/deepseek-v4.1-flash
    reasoning: low
    mutates_files: false
    tools:
      - filesystem
      - openspec
      - engram
      - codegraph
    prompt_template: prompts/explorer.md
    responsibilities:
      - explore_repository
      - identify_relevant_files
      - propose_solution
      - record_findings_with_engram

  critic:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: false
    tools:
      - filesystem
      - openspec
      # The critic consults Engram before challenging a plan (REQ-017): the one
      # step whose job is to catch a repeated mistake needs what the project
      # already learned. Like every grant this records the intent, it does not
      # enforce a tool set.
      - engram
    prompt_template: prompts/critic.md
    responsibilities:
      - challenge_plan
      - identify_risks
      - suggest_simpler_approach

  implementer:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - shell
      - tests
      - engram
      - codegraph
    prompt_template: prompts/implementer.md
    responsibilities:
      - check_dependents_before_editing_shared_symbols
      - edit_files
      - run_checks
      - inspect_diff
      - record_findings_with_engram

  # REQ-014: the tests are a step of their own. The implementer makes the change
  # and runs the cheapest check that proves it builds; the tester writes the
  # tests, runs them, and declares the results the harness gates delivery on.
  # It mutates files because writing tests is writing files.
  tester:
    model: opencode-go/space-bunny-free
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - shell
      - tests
      - engram
      - codegraph
    prompt_template: prompts/tester.md
    responsibilities:
      - write_the_tests_the_change_needs
      - run_the_projects_checks
      - declare_the_checks_and_their_results
      - record_findings_with_engram

  delivery:
    model: opencode-go/space-bunny-free
    reasoning: low
    mutates_files: true
    tools:
      - git
      - github
    skills:
      - github-delivery
    prompt_template: prompts/delivery.md
    responsibilities:
      - create_branch
      - commit_changes
      - push_branch
      - create_pull_request

skills:
  project_directory: .agents/skills
  current:
    - github-delivery
  create_when:
    - a procedure is repeated across tasks
    - a procedure has safety or ordering constraints
    - a procedure requires project-specific conventions
    - a procedure benefits from a checklist
