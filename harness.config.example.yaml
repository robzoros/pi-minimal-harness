project: my-project

defaults:
  workflow_mode: simple
  auto_harness: true
  question_short_circuit: true
  allow_dispatch: true
  allow_simple_mode: true
  # A missing or ambiguous decision marker stops the pipeline instead of being
  # read as "not ANSWER_ONLY", which would run the mutating steps of a task
  # that may only need an answer. Set to false to keep guessing.
  strict_decision_marker: true
  # `advisory` only reports the repository state; `blocking` stops the first
  # step that mutates files when the tree is dirty or a pull request is open.
  preflight_policy: advisory

commands:
  preferred_interface: slash
  fallback_interface: skills
  model_catalog_source: /models

workflows:
  full-dry-run:
    steps:
      - orchestrator
      - explorer
      - critic
  full:
    steps:
      - orchestrator
      - explorer
      - critic
      - implementer
      - delivery
  simple:
    steps:
      - orchestrator
      - implementer
  implementation-only:
    steps:
      - orchestrator
      - implementer
  delivery-only:
    steps:
      - orchestrator
      - delivery

agents:
  orchestrator:
    model: provider/model-id
    reasoning: medium
    mutates_files: false
    tools:
      - filesystem
      - engram
      # The orchestrator runs in every mode, so structural exploration belongs
      # here too; remove the line when CodeGraph is not installed.
      - codegraph
      # The orchestrator identifies (or creates) the issue the delivery step
      # must close, so it needs the GitHub tool as well.
      - github
    prompt_template: prompts/orchestrator.md
    responsibilities:
      - classify_task
      - select_workflow_mode
      - prepare_next_agent_prompt
      - record_findings_with_engram
  explorer:
    model: provider/model-id
    reasoning: high
    mutates_files: false
    tools:
      - filesystem
      - openspec
      - engram
      - codegraph
    prompt_template: prompts/explorer.md
    responsibilities:
      - explore_repository
      - identify_relevant_files
      - propose_solution
      - record_findings_with_engram
  critic:
    model: provider/model-id
    reasoning: medium
    mutates_files: false
    tools:
      - filesystem
      - openspec
    prompt_template: prompts/critic.md
    responsibilities:
      - challenge_plan
      - identify_risks
      - suggest_simpler_approach
  implementer:
    model: provider/model-id
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - shell
      - tests
      - engram
      # `simple` and `implementation-only` never run the explorer, so the only
      # step that edits files needs the impact check itself.
      - codegraph
    prompt_template: prompts/implementer.md
    responsibilities:
      - check_dependents_before_editing_shared_symbols
      - edit_files
      - run_checks
      - inspect_diff
      - record_findings_with_engram
  delivery:
    model: provider/model-id
    reasoning: low
    mutates_files: true
    tools:
      - git
      - github
    skills:
      - github-delivery
    prompt_template: prompts/delivery.md
    responsibilities:
      - create_branch
      - commit_changes
      - push_branch
      - create_pull_request

skills:
  project_directory: .agents/skills
  current:
    - github-delivery
  create_when:
    - a procedure is repeated across tasks
    - a procedure has safety or ordering constraints
    - a procedure requires project-specific conventions
    - a procedure benefits from a checklist
