project: my-project

defaults:
  workflow_mode: full
  auto_harness: true
  allow_dispatch: true
  # A question, an idea or anything needing conceptual design routes to the
  # `analysis` workflow (orchestrator -> architect) instead of ending after the
  # orchestrator. Set to false to make ANSWER_ONLY end the pipeline there.
  analysis_routing: true
  # Where the architect keeps the formal requirements of the work in design.
  # Project-owned: `init`/`update` create it when missing and never overwrite
  # it. `.agents/REQUIREMENTS.md` is the documented alternative.
  requirements_file: REQUIREMENTS.md
  # The shape `init`/`update` write when they create that file: `sections` is
  # the three empty headings, `req-n` is one `### REQ-nnn` block per
  # requirement. The harness never parses it — it is a convention the project
  # picks, not a setting with consequences. Change it with /harness-config.
  requirements_format: sections
  # How long a check declared in a step report may run before the harness gives
  # up on it. Separate from the preflight's short git probes: a test suite
  # legitimately takes seconds. 300000 (5 min) is a safe default.
  check_timeout_ms: 300000
  # A missing or ambiguous decision marker stops the pipeline instead of being
  # read as "not ANSWER_ONLY", which would run the mutating steps of a task
  # that may only need an answer. Set to false to keep guessing.
  strict_decision_marker: true
  # `advisory` only reports the repository state; `blocking` stops the first
  # step that mutates files when the tree is dirty or a pull request is open.
  preflight_policy: advisory

commands:
  preferred_interface: slash
  fallback_interface: skills
  model_catalog_source: /models

workflows:
  full-dry-run:
    steps:
      - orchestrator
      - explorer
      - critic
  full:
    steps:
      - orchestrator
      - explorer
      - critic
      - implementer
      - delivery
  analysis:
    steps:
      - orchestrator
      - architect

agents:
  architect:
    model: provider/model-id
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - engram
      # The architect sizes the work with CodeGraph while discussing it; remove
      # the line when CodeGraph is not installed.
      - codegraph
      # Issues belong to the architect: an issue is a statement of scope, and
      # creating one is writing the contract. It creates the issue the work
      # closes when the user approves the requirements.
      - github
    prompt_template: prompts/architecture.md
    responsibilities:
      - discuss_with_the_user
      - analyse_the_repository
      - maintain_the_requirements_file
      - record_findings_with_engram
  orchestrator:
    model: provider/model-id
    reasoning: medium
    mutates_files: false
    # The router is granted no tools at all. Its control tools (harness_decision,
    # harness_report) are registered by the extension and are not gated by this
    # list, so routing survives an empty one. An issue is a statement of scope,
    # and scope belongs to the architect.
    tools: []
    prompt_template: prompts/orchestrator.md
    responsibilities:
      - classify_task
      - select_workflow_mode
      - prepare_next_agent_prompt
  explorer:
    model: provider/model-id
    reasoning: high
    mutates_files: false
    tools:
      - filesystem
      - openspec
      - engram
      - codegraph
    prompt_template: prompts/explorer.md
    responsibilities:
      - explore_repository
      - identify_relevant_files
      - propose_solution
      - record_findings_with_engram
  critic:
    model: provider/model-id
    reasoning: medium
    mutates_files: false
    tools:
      - filesystem
      - openspec
      # The critic consults Engram before challenging a plan (REQ-017). Like
      # every grant this records the intent, it does not enforce a tool set.
      - engram
    prompt_template: prompts/critic.md
    responsibilities:
      - challenge_plan
      - identify_risks
      - suggest_simpler_approach
  implementer:
    model: provider/model-id
    reasoning: high
    mutates_files: true
    tools:
      - filesystem
      - shell
      - tests
      - engram
      # `full-dry-run` and `analysis` never run the implementer, so when one of
      # them is the active mode this is the only step that edits files, and the
      # impact check belongs here.
      - codegraph
    prompt_template: prompts/implementer.md
    responsibilities:
      - check_dependents_before_editing_shared_symbols
      - edit_files
      - run_checks
      - inspect_diff
      - record_findings_with_engram
  delivery:
    model: provider/model-id
    reasoning: low
    mutates_files: true
    tools:
      - git
      - github
    skills:
      - github-delivery
    prompt_template: prompts/delivery.md
    responsibilities:
      - create_branch
      - commit_changes
      - push_branch
      - create_pull_request

skills:
  project_directory: .agents/skills
  current:
    - github-delivery
  create_when:
    - a procedure is repeated across tasks
    - a procedure has safety or ordering constraints
    - a procedure requires project-specific conventions
    - a procedure benefits from a checklist
