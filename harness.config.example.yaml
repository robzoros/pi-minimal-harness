# pi-minimal-harness configuration (v2)
#
# v2 has no workflow modes: the flow is fixed and the runtime is a state
# machine. Every key below is read by the runtime; there are no documentation-
# only keys. Anything not listed here is rejected by `validate` with an error.

harness:
  # Must be 2. A missing or different value means this is a v1 configuration;
  # run `npx pi-minimal-harness update` to migrate it.
  version: 2
  requirements_file: .harness/requirements.md
  # Shared retry budget: one unit is spent every time the workflow re-enters
  # IMPLEMENTING, whether the reviewer or the tester sent it back. With 3, the
  # implementer runs at most 4 times before the workflow suspends for the user.
  max_retries: 3
  agent_timeout_ms: 300000
  # Plain (non-slash) requests start the workflow.
  auto_start: true
  # Contract injected into each agent. Falls back to pi-minimal-harness.md, then
  # an AGENTS.md carrying the harness block.
  subagent_context_file: pi-minimal-harness.md

agents:
  planner:
    model: provider/model-id
    reasoning: high
    # Owns the requirements file, so it needs `write` for that file and nothing
    # else. It writes no code; that is a role boundary, not a capability one —
    # Pi's write capability cannot be restricted to a path.
    capabilities: [read, write, memory, graph]

  explorer:
    model: provider/model-id
    reasoning: medium
    capabilities: [read, memory, graph]

  implementer:
    model: provider/model-id
    reasoning: high
    # The only agent that changes files. `write` and `shell` are what make it so;
    # `vcs` and `github` require `shell`.
    capabilities: [read, write, shell, vcs, github, memory, graph]

  reviewer:
    model: provider/model-id
    reasoning: high
    # No `shell`: it cannot run commands, so it cannot "fix" anything by accident.
    capabilities: [read, graph, memory]

  tester:
    model: provider/model-id
    reasoning: high
    capabilities: [read, shell, memory]

  deliverer:
    model: provider/model-id
    reasoning: low
    capabilities: [read, shell, vcs, github, memory]

# Capabilities, and how far each one can actually be enforced:
#
#   read    -> read, find, grep, ls        enforced with --tools
#   write   -> edit, write                 enforced with --tools
#   shell   -> bash                        enforced with --tools
#   memory  -> mem_*                       declared; WARN if no such tool is registered
#   graph   -> codegraph_*                 declared; WARN if no such tool is registered
#   vcs     -> git                         declared; REQUIRES `shell`
#   github  -> gh + the delivery skill     declared; REQUIRES `shell`
#
# Only the first three map to Pi tool names, because Pi's vocabulary is
# {read, bash, edit, write, find, grep, ls, powershell}. The rest are MCP
# servers whose names depend on your own setup, or shell commands.
